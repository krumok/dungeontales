<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #000; 
            /* PUNTO 4: Sfondo pergamena con il tuo file */
            background-image: url('assets/DT_Sfondo_Generatore.png');
            background-size: 1200px auto; 
            background-repeat: no-repeat;
            background-position: top center;
            background-attachment: scroll;
            margin: 0;
            padding: 0;
            font-family: 'Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-logo {
            max-width: 90%;
            width: 600px;
            margin: 40px 0 20px 0;
        }

        /* PUNTO 2: Banner nero largo con testo bianco */
        .banner-istruzioni {
            background-color: #000;
            width: 100%;
            max-width: 1200px;
            text-align: center;
            padding: 14px 0;
            margin-bottom: 50px;
        }

        /* Cornice Rossa Interna */
        .box-rosso {
			background-image: url(assets/cornice1.png);
			background-size: 100% 100%;
			background-repeat: no-repeat;
			background-position: center;
			padding: 32px 10px 14px 10px;
			display: inline-block;
			width: 520px;
			height: 90px;
			max-width: 90%;
        }

        .box-rosso h2 {
            margin: 0;
            font-size: 1.6em;
            color: #FFF;
            text-transform: uppercase;
        }

        .box-rosso p {
            margin: 5px 0 0 0;
            font-size: 1em;
            color: #FFF;
        }

        /* PUNTO 1: Griglia per 8 ingressi (4 per riga) */
        .grid-ingressi {
            display: grid;
            grid-template-columns: repeat(4, 220px); 
            gap: 40px 20px; /* Spazio verticale 40px, orizzontale 20px */
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            padding-bottom: 100px;
        }

        .cornice-box {
            position: relative;
            width: 220px;
            height: 300px;
            background-image: url('assets/corniceb.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            padding: 18px; /* Spazio per far respirare la mappa */
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
		
		.cornice-boxt {
			background-image: url('assets/cornicet.png') !important;
		}

        .cornice-box:hover {
            transform: scale(1.05);
        }

        .mappa-img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }

        .label-ingresso {
            position: absolute;
            bottom: -35px;
            width: 100%;
            text-align: center;
            color: #FFF; 
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1em;
            text-shadow: 2px 2px 4px #000;
        }

		.cornice-link {
		    text-decoration: none;
		    color: inherit;
		    display: block;
		}		

        /* PUNTO 2: RESPONSIVE PER SMARTPHONE */
        @media (max-width: 900px) {
            body {
                background-size: cover; /* La pergamena si adatta allo schermo piccolo */
            }
            .grid-ingressi {
                grid-template-columns: repeat(2, 160px); /* 2 per riga su mobile */
                gap: 50px 15px;
            }
            .cornice-box {
                width: 160px;
                height: 220px;
            }
            .header-logo {
                width: 80%;
            }
            .box-rosso {
                min-width: 80%;
            }
            .box-rosso h2 { font-size: 1.2em; }
            .box-rosso p { font-size: 0.8em; }
        }
		
    </style>
	<script>
	  (function() {
		const sitoAutorizzato = "sites.google.com";
		if (!document.referrer.includes(sitoAutorizzato)) {
		  //window.location.href = "https://sites.google.com/view/generatore-dungeontales";
		}
	  })();
	  
(function() {
    const urlParams = new URLSearchParams(window.location.search);
    const segreto = urlParams.get('access');
	console.log(segreto);
    // Se il segreto non corrisponde a quello impostato nel pulsante nativo
    if (segreto !== 'ALFA_99_OMEGA') {
        // Mostra un messaggio e poi rimanda a Google Sites
        //document.body.innerHTML = "<h1>Accesso non autorizzato!</h1><p>Torna al portale ufficiale...</p>";
		console.log('rimando a google');
        setTimeout(() => {
          //  window.location.href = "https://sites.google.com/view/generatore-dungeontales/generatore";
        }, 100);
    } else {
        // Accesso OK: Salva nella sessione per le altre pagine del dungeon
		console.log('accesso ok');
		sessionStorage.setItem('verified', 'true');
    }
})();
	</script>	
</head>
<body>
	<div id="menu-container"></div>

    <img src="assets/Logo_DT_Esteso_Nero.png" class="header-logo">

    <div class="banner-istruzioni">
        <div class="box-rosso">
            <h2>Ingresso del Dungeon</h2>
            <p>Tirare <b>1D8</b> per il tipo di ingresso e cliccare sull'ingresso corrispondente</p>
        </div>
    </div>

    <div class="grid-ingressi">
		<div class="cornice-box" onclick="location.href='ingresso-1.html'"><img src="assets/ingresso-1.jpg" class="mappa-img"><div class="label-ingresso">Ingresso 1</div></div>
        <div class="cornice-box cornice-boxt" onclick="location.href='ingresso-2.html'"><img src="assets/ingresso-2t.png" class="mappa-img"><div class="label-ingresso">Ingresso 2</div></div>
        <div class="cornice-box cornice-boxt" onclick="location.href='ingresso-3.html'"><img src="assets/ingresso-3t.png" class="mappa-img"><div class="label-ingresso">Ingresso 3</div></div>
        <div class="cornice-box" onclick="location.href='ingresso-4.html'"><img src="assets/ingresso-4.png" class="mappa-img"><div class="label-ingresso">Ingresso 4</div></div>
        
        <div class="cornice-box" onclick="location.href='ingresso-5.html'"><img src="assets/ingresso-5.png" class="mappa-img"><div class="label-ingresso">Ingresso 5</div></div>
        <div class="cornice-box" onclick="location.href='ingresso-6.html'"><img src="assets/ingresso-6.png" class="mappa-img"><div class="label-ingresso">Ingresso 6</div></div>
        <div class="cornice-box" onclick="location.href='ingresso-7.html'"><img src="assets/ingresso-7.png" class="mappa-img"><div class="label-ingresso">Ingresso 7</div></div>
        <div class="cornice-box" onclick="location.href='ingresso-8.html'"><img src="assets/ingresso-8.png" class="mappa-img"><div class="label-ingresso">Ingresso 8</div></div>
    </div>
<script>
	//document.getElementById('mobile-menu').onclick = function() {
	//	document.querySelector('.nav-list').classList.toggle('active');
	//};	
	
	fetch('menu.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('menu-container').innerHTML = data;

        // Re-inizializza il tasto mobile dopo il caricamento
        const mobileMenu = document.getElementById('mobile-menu');
        if(mobileMenu) {
            mobileMenu.onclick = function() {
                document.querySelector('.nav-list').classList.toggle('active');
            };
        }
    });
</script>
</body>
</html>
