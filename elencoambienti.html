<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Archivio Esplorazione - Dungeon Tales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        
        .split-container {
            display: flex;
            height: 100vh;
        }

        /* Colonna Sinistra: Elenco */
        .sidebar {
            width: 35%;
            border-right: 3px double #5d4037;
            background: #e4dcb7;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        /* Colonna Destra: Anteprima */
        .preview-area {
            width: 65%;
            background: #fdfaf0;
            overflow-y: auto;
            padding: 20px;
        }

        .history-card {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #d2b48c;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .history-card:hover { background: #f9f7ef; transform: scale(1.02); }
        .history-card.active { border: 2px solid #b71c1c; background: #fff; }

        .card-title { font-weight: bold; display: block; color: #5d4037; }
        .card-date { font-size: 0.75rem; color: #888; }

        .toolbar { margin-bottom: 15px; text-align: center; }

        /* Responsive per mobile */
        @media screen and (max-width: 768px) {
            .split-container { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; border-right: none; border-bottom: 3px double #5d4037; }
            .preview-area { width: 100%; height: 60%; }
        }
		
		.modal-overlay {
		  position: fixed;
		  top: 0; left: 0; width: 100%; height: 100%;
		  background: rgba(0, 0, 0, 0.8);
		  display: flex;
		  justify-content: center;
		  align-items: center;
		  z-index: 1000;
		}

		.modal-content {
		  background: #f4ecd8; /* Stesso colore pergamena delle stanze */
		  padding: 20px;
		  border: 3px solid #5d4037;
		  border-radius: 8px;
		  text-align: center;
		  max-width: 300px;
		  box-shadow: 0 0 20px rgba(0,0,0,0.5);
		}

		.modal-buttons {
		  margin-top: 20px;
		  display: flex;
		  justify-content: space-around;
		}

		.confirm-btn { background-color: #8d2e2e !important; }
		.cancel-btn { background-color: #5d4037 !important; }		
    </style>
</head>
<body>

<div class="split-container">
    <div class="sidebar">
        <p class="tithead">Archivio Generatore</p>
        <div class="toolbar">
            <button class="dungeon-btn" style="font-size: 0.7rem; padding: 5px;" onclick="resetLocalStorage()">Svuota Tutto</button>
        </div>
        <div id="lista-history"></div>
    </div>

    <div class="preview-area" id="anteprima-dungeon">
        <p style="text-align: center; color: #888; margin-top: 50px; font-style: italic;">
            Seleziona un ambiente dall'elenco per visualizzare i dettagli.
        </p>
    </div>
</div>

<div id="custom-confirm" class="modal-overlay" style="display:none;">
  <div class="modal-content">
    <p class="basep"><b>ATTENZIONE:</b><br>Vuoi davvero svuotare l'intero archivio degli ambienti?</p>
    <div class="modal-buttons">
      <button class="dungeon-btn confirm-btn" onclick="eseguiReset()">SÌ, CANCELLA</button>
      <button class="dungeon-btn cancel-btn" onclick="chiudiConfirm()">ANNULLA</button>
    </div>
  </div>
</div>

<script>
    let dungeonDati = [];

    function caricaArchivio() {
        const listaDiv = document.getElementById('lista-history');
        // Usiamo la chiave 'dungeon_history' che abbiamo definito in dungeon-core.js
        dungeonDati = JSON.parse(localStorage.getItem('dungeon_history') || "[]");

        if (dungeonDati.length === 0) {
            listaDiv.innerHTML = '<p style="font-size:0.8rem; text-align:center;">Nessun ambiente salvato.</p>';
            return;
        }

        listaDiv.innerHTML = dungeonDati.map((item, index) => `
            <div class="history-card" onclick="mostraDettaglio(${index}, this)">
                <span class="card-title">${item.tipo}</span>
                <span class="card-date">${item.orario}</span>
            </div>
        `).join('');
    }

    function mostraDettaglio(index, elemento) {
        // Rimuovi classe active dagli altri
        document.querySelectorAll('.history-card').forEach(c => c.classList.remove('active'));
        elemento.classList.add('active');

        const preview = document.getElementById('anteprima-dungeon');
        preview.innerHTML = `
            <div style="margin-bottom: 10px; border-bottom: 1px solid #d2b48c; padding-bottom: 5px;">
                <span style="font-size: 0.8rem; color: #b71c1c; font-weight: bold;">DATA GENERAZIONE: ${dungeonDati[index].orario}</span>
            </div>
            ${dungeonDati[index].testo}
        `;
    }

	// Questa funzione viene chiamata dal pulsante "Svuota Archivio" principale
	function resetLocalStorage() {
		// Invece del confirm() del browser, mostriamo il nostro DIV
		document.getElementById('custom-confirm').style.display = 'flex';
	}

	// Se l'utente clicca su "ANNULLA"
	function chiudiConfirm() {
		document.getElementById('custom-confirm').style.display = 'none';
	}

	// Se l'utente clicca su "SÌ, CANCELLA"
	function eseguiReset() {
		localStorage.removeItem('dungeon_history'); // Assicurati che la chiave sia corretta
		chiudiConfirm();
		location.reload(); // Ricarica la pagina per aggiornare la lista
	}

    window.onload = caricaArchivio;
</script>

</body>
</html>
