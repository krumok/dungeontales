<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Archivio Esplorazione</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
		
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
	
    <style>
        /* FIX FONDAMENTALE PER MOBILE: impedisce a padding e bordi di allargare la pagina */
        *, *:before, *:after {
            box-sizing: border-box;
        }

        body {
            background-color: #000; 
            margin: 0;
            padding: 0;
            font-family: 'Garamond', serif;
            overflow: hidden; /* Evita il doppio scroll fastidioso della pagina intera */
            width: 100%;
        }
        
        .split-container {
            display: flex;
            height: calc(100vh - 50px); /* Sottrae l'altezza della navbar */
            margin-top: 1px; /* Lascia lo spazio per la navbar fixed */
            width: 100%;
        }

        /* Colonna Sinistra: Elenco */
        .sidebar {
            width: 35%;
            border-right: 3px double #5d4037;
            background: #e4dcb7;
            overflow-y: scroll; /* Forza la visualizzazione costante della barra */
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        /* Colonna Destra: Anteprima */
        .preview-area {
            width: 65%;
            background-color: #000; 
            background-image: url('assets/DT_Sfondo_Generatore2.png');
            background-repeat: repeat-y; 
            background-position: top center;
            background-attachment: scroll; 
            overflow-y: auto;
            padding: 10px;
        }

        .history-card {
            background: white;
            padding: 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            border: 3px solid #d2b48c;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .history-card:hover { background: #f9f7ef; transform: scale(1.02); }
        .history-card.active { border: 2px solid #b71c1c; background: #fff; }

        .card-title { font-weight: bold; display: block; color: #5d4037; }
        .card-date { font-size: 0.75rem; color: #888; }

        .toolbar { margin-bottom: 10px; }
		
        .sidebar::-webkit-scrollbar { width: 14px; }
        .sidebar::-webkit-scrollbar-thumb { 
            background: #8d2e2e; 
            border-radius: 10px; 
            border: 3px solid #e4dcb7; 
        }
        .sidebar::-webkit-scrollbar-track { background: #d2c8a0; }		
	
        .frecciasu {
            display:none;
        }
		
        @media screen and (max-width: 768px) {
            .split-container {
                flex-direction: column; /* Lista sopra, Anteprima sotto */
            }
            .sidebar {
                width: 100%; /* Riportato a 100% in totale sicurezza grazie al box-sizing */
                height: 45vh; /* Bilanciato per distribuire lo schermo con la navbar */
                border-right: none;
                border-bottom: 3px double #5d4037;
            }
            .preview-area {
                width: 100%; /* Riportato a 100% in totale sicurezza grazie al box-sizing */
                height: 55vh;
            }
			
            .history-card {
                padding: 15px; 
                margin-bottom: 12px;
                border: 2px solid #5d4037;
            }

            .frecciasu {
                font-style: normal; 
                font-size:26px;
                display: inline-block;
            }					
        }		
			
        .confirm-btn { background-color: #8d2e2e !important; }
        .cancel-btn { background-color: #5d4037 !important; }		
    </style>
	</head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F2H5M43CF4"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-F2H5M43CF4');
</script>		
	<body>
		<div id="menu-container"></div>

		<div class="split-container">
			<div class="sidebar">
				<p class="tithead">Archivio Generatore</p>
							
				<div style="margin-bottom:5px;">
					<label style="font-size:0.7rem; color:#5d4037;">Seleziona Dungeon:</label>
					<select id="select-dungeon" class="dungeon-btn" style="width:100%; height:auto;" onchange="cambiaDungeonVisualizzato()">
					</select>
					<button class="dungeon-btn" style="margin-top:5px; font-size: 0.7rem; padding: 5px;" onclick="confermaEliminaSingolo()">ELIMINA QUESTO DUNGEON</button>
				</div>

			<div id="confirm-delete-single" class="modal-overlay" style="display:none;">
			<div class="modal-content">
				<p class="basep">Sei sicuro di voler eliminare <b>definitivamente</b> questo dungeon e tutte le sue stanze?<br><br><span id="nome-da-eliminare" style="color:#8d2e2e; font-weight:bold;"></span></p>
					<div class="modal-buttons">
						<button class="dungeon-btn" onclick="eseguiEliminaSingolo()">ELIMINA</button>
						<button class="dungeon-btn" onclick="chiudiConfirmSingolo()">ANNULLA</button>
					</div>
				</div>
			</div>
			
			<div style="margin-top: auto; padding-top: 10px;">
				<div style="font-size: 0.65rem; color: #5d4037; margin-bottom: 5px; display: flex; justify-content: space-between;">
					<span>MEMORIA ARCHIVIO:</span>
					<span id="percentuale-testo">0%</span>
				</div>
				<div style="width: 100%; height: 8px; background: #d2c8a0; border: 1px solid #5d4037; border-radius: 4px; overflow: hidden;">
					<div id="barra-memoria" style="width: 0%; height: 100%; background: #8d2e2e; transition: width 0.5s;"></div>
				</div>
			</div>
			
			<div class="toolbar">
				<button class="dungeon-btn" style="font-size: 0.7rem; padding: 5px;" onclick="resetLocalStorage()">Svuota Tutto l'Archivio</button>
			</div>
			<div id="lista-history"></div>
		</div>

		<div class="preview-area" id="anteprima-dungeon">
			<p style="text-align: center; color: #222; margin-top: 50px; font-weight:bold; font-style: italic;">
				Seleziona un ambiente dalla lista per visualizzare la versione generata e salvata in archivio.
			</p>
		</div>
	</div>

	<div id="custom-confirm" class="modal-overlay" style="display:none;">
	  <div class="modal-content">
		<p class="basep"><b>ATTENZIONE:</b><br>Vuoi davvero svuotare l'intero archivio degli ambienti?</p>
		<div class="modal-buttons">
		  <button class="dungeon-btn confirm-btn" onclick="eseguiReset()">SÌ, CANCELLA</button>
		  <button class="dungeon-btn cancel-btn" onclick="chiudiConfirm()">ANNULLA</button>
		</div>
	  </div>
	</div>
	
	<script src="js/menu.js" defer></script>

	<script>
		let tutteLeSessioni = {};
		let dungeonDati = [];

		function caricaArchivio() {
			const select = document.getElementById('select-dungeon');
			const tutteLeSessioni = JSON.parse(localStorage.getItem('dungeon_sessions') || "{}");
			const nomiDungeon = Object.keys(tutteLeSessioni);
			const attuale = localStorage.getItem('current_dungeon_name'); // Recuperiamo il dungeon attivo

			if (nomiDungeon.length === 0) {
				select.innerHTML = '<option value="">Nessun Dungeon</option>';
				document.getElementById('lista-history').innerHTML = '<p style="font-size:0.8rem; text-align:center; padding:20px;">Nessun ambiente salvato.</p>';
				return;
			}

			// Popola la select
			select.innerHTML = nomiDungeon.map(nome => `<option value="${nome}">${nome}</option>`).join('');

			// PUNTO 1: Seleziona automaticamente il dungeon corrente se esiste
			if (attuale && tutteLeSessioni[attuale]) {
				select.value = attuale;
			}
			
			cambiaDungeonVisualizzato();
			aggiornaIndicatoreMemoria();
		}
		
		function aggiornaIndicatoreMemoria() {
			const LIMITE_MB = 5; // Limite teorico browser
			let totaleByte = 0;
			for (let chiave in localStorage) {
				if (localStorage.hasOwnProperty(chiave)) {
					totaleByte += (localStorage[chiave].length + chiave.length) * 2;
				}
			}
			
			const mbOccupati = totaleByte / (1024 * 1024);
			const percentuale = Math.min((mbOccupati / LIMITE_MB) * 100, 100).toFixed(1);
			
			document.getElementById('barra-memoria').style.width = percentuale + "%";
			document.getElementById('percentuale-testo').innerText = percentuale + "%";
			
			// Se supera l'80%, coloriamo la barra di rosso acceso
			if (percentuale > 80) {
				document.getElementById('barra-memoria').style.background = "#ff0000";
			}
		}

		// FUNZIONI PER L'ELIMINAZIONE SINGOLA
		function confermaEliminaSingolo() {
			const nome = document.getElementById('select-dungeon').value;
			if (!nome || nome === "") return;
			
			document.getElementById('nome-da-eliminare').innerText = nome;
			document.getElementById('confirm-delete-single').style.display = 'flex';
		}

		function chiudiConfirmSingolo() {
			document.getElementById('confirm-delete-single').style.display = 'none';
		}

		function eseguiEliminaSingolo() {
			const nomeDaEliminare = document.getElementById('select-dungeon').value;
			let sessioni = JSON.parse(localStorage.getItem('dungeon_sessions') || "{}");

			// Elimina la chiave specifica
			delete sessioni[nomeDaEliminare];
			localStorage.setItem('dungeon_sessions', JSON.stringify(sessioni));

			// Se abbiamo eliminato proprio il dungeon su cui stavamo lavorando nel generatore
			if (localStorage.getItem('current_dungeon_name') === nomeDaEliminare) {
				localStorage.removeItem('current_dungeon_name');
			}

			chiudiConfirmSingolo();
			caricaArchivio(); // Ricarica la UI
		}

		function cambiaDungeonVisualizzato() {
			const select = document.getElementById('select-dungeon');
			const nomeSelezionato = select.value;
			
			// Recuperiamo tutte le sessioni
			const tutteLeSessioni = JSON.parse(localStorage.getItem('dungeon_sessions') || "{}");
			dungeonDati = tutteLeSessioni[nomeSelezionato] || [];

			const listaDiv = document.getElementById('lista-history');
			
			if (dungeonDati.length === 0) {
				listaDiv.innerHTML = '<p style="font-size:0.8rem; text-align:center; padding:20px;">Dungeon vuoto.</p>';
			} else {
				listaDiv.innerHTML = dungeonDati.map((item, index) => `
					<div class="history-card" onclick="mostraDettaglio(${index}, this)">
						<span class="card-title">${item.tipo}</span>
						<span class="card-date">${item.orario}</span>
					</div>
				`).reverse().join(''); // .reverse() mette l'ultima stanza generata in alto
			}
			
			document.getElementById('anteprima-dungeon').innerHTML = '<p style="text-align: center; color: #222; margin-top: 50px; font-weight:bold; font-style: italic;"><span class=frecciasu>↑️</span><br>Seleziona un ambiente dalla lista per visualizzare la versione generata e salvata in archivio.</p>';
		}

		// Aggiorna eseguiReset per pulire tutto
		function eseguiReset() {
			localStorage.removeItem('dungeon_sessions');
			localStorage.removeItem('current_dungeon_name');
			chiudiConfirm();
			location.reload();
		}		

		function mostraDettaglio(index, elemento) {
			// Rimuovi classe active dagli altri
			document.querySelectorAll('.history-card').forEach(c => c.classList.remove('active'));
			elemento.classList.add('active');
			
			const select = document.getElementById('select-dungeon');
			const nomeSelezionato = select.value;

			const preview = document.getElementById('anteprima-dungeon');
			preview.innerHTML = `
				<div style="margin-bottom: 10px; border-bottom: 1px solid #d2b48c; padding-bottom: 5px;">
					<span style="font-size: 0.8rem; color: #b71c1c; font-weight: bold;">DATA GENERAZIONE: ${dungeonDati[index].orario}</span><br>
					<span style="font-size: 0.8rem; color: #b71c1c; font-weight: bold;">DUNGEON: ${nomeSelezionato}</span>
				</div>
				${dungeonDati[index].testo}
			`;
		}

		// Questa funzione viene chiamata dal pulsante "Svuota Archivio" principale
		function resetLocalStorage() {
			// Invece del confirm() del browser, mostriamo il nostro DIV
			document.getElementById('custom-confirm').style.display = 'flex';
		}

		// Se l'utente clicca su "ANNULLA"
		function chiudiConfirm() {
			document.getElementById('custom-confirm').style.display = 'none';
		}

		window.onload = caricaArchivio;
	</script>
</body>
</html>
