<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: url('assets/DT_Sfondo_Generatore.png'); /* Il tuo sfondo */
            background-repeat: repeat;
            margin: 0;
            padding: 20px;
            font-family: 'Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-logo {
            max-width: 100%;
            width: 500px;
            margin-bottom: 20px;
        }

        .banner-istruzioni {
            background-color: #000;
            color: #ff4444;
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 10px 0;
            border: 2px solid #d3a96c;
            border-radius: 5px;
            margin-bottom: 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .grid-ingressi {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            width: 100%;
            max-width: 1000px;
            justify-items: center;
        }

		/* IL CONTENITORE CON LA CORNICE */
		.cornice-box {
			position: relative;
			width: 200px;  /* Dimensione fissa per coerenza */
			height: 280px; /* Proporzione verticale tipica delle tue cornici */
			background-image: url('assets/cornice_ingresso.png'); /* Assicurati che il percorso sia corretto */
			background-size: contain;
			background-repeat: no-repeat;
			background-position: center;
			cursor: pointer;
			transition: transform 0.3s ease;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.cornice-box:hover {
			transform: scale(1.08);
		}

		/* L'IMMAGINE DELLA MAPPA DENTRO LA CORNICE */
		.mappa-img {
			position: absolute;
			top: 15%;      /* Sposta la mappa verso il basso per centrarla nel vuoto della cornice */
			width: 70%;    /* Riduce la dimensione della mappa per non coprire i bordi d'oro */
			height: auto;
			z-index: -1;   /* Opzionale: mette la mappa "dietro" la cornice se la cornice ha il centro trasparente */
		}

		/* ETICHETTA SOTTO LA CORNICE */
		.label-ingresso {
			position: absolute;
			bottom: -25px; /* Mette il testo fuori dalla cornice, in basso */
			color: #d3a96c;
			font-weight: bold;
			text-transform: uppercase;
			font-size: 0.9em;
			text-shadow: 1px 1px 2px #000;
			width: 100%;
			text-align: center;
		}
    </style>
</head>
<body>

    <img src="assets/Logo_DT_Esteso_Nero.png" class="header-logo">

    <div class="banner-istruzioni">
        <h2 style="margin:0; font-size: 1.5em;">INGRESSO DEL DUNGEON</h2>
        <p style="margin:5px 0 0 0;">Tirare <b>1D8</b> per il tipo di ingresso e cliccare sull'ingresso corrispondente</p>
    </div>

    <div class="grid-ingressi">
        <div class="cornice-box" onclick="window.top.location.href='https://sites.google.com/view/generatore-dungeontales/ingresso-1'">
            <img src="assets/ingresso-1.jpg" class="mappa-img">
            <div class="label-ingresso">Ingresso 1</div>
        </div>

        <div class="cornice-box" onclick="window.top.location.href='https://sites.google.com/view/generatore-dungeontales/ingresso-2'">
            <img src="assets/ingresso-2.png" class="mappa-img">
            <div class="label-ingresso">Ingresso 2</div>
        </div>

        </div>

</body>
</html>
